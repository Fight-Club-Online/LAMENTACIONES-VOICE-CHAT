version: '3.8'

services:
  # Tu aplicación de Node.js (Voice Chat)
  voice-chat:
    build: .
    container_name: lamentaciones-voice-chat
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=rabbitmq # Sobrescribimos para que apunte al servicio interno
    depends_on:
      rabbitmq:
        condition: service_healthy

  # El servicio de mensajería RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-service
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5