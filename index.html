<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Chat Transcription & Voice</title>
    <style>
      /* Mantengo tu CSS para que los botones dinámicos no se vean desordenados */
      body { margin: 0; padding-bottom: 3rem; font-family: sans-serif; background-color: #f4f7f6; }
      #user-control-panel { background: #fff; border-bottom: 2px solid #ddd; padding: 10px; position: sticky; top: 0; z-index: 100; }
      #user-ui-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
      #user-ui-list li { background: #eceff1; padding: 8px; border-radius: 10px; display: flex; align-items: center; border: 1px solid #cfd8dc; }
      
      #messages { list-style-type: none; margin: 0; padding: 10px; }
      #form { background: white; padding: 0.5rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; border-top: 1px solid #ccc; }
      #input { border: 1px solid #ddd; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; }
      button { border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 10px; cursor: pointer; color: #fff; font-weight: bold; }
      
      #form > button { background: #333; }
      #llamada { background: #4caf50; }
      #btn-hablar { background: #2196f3; }
      #btn-mute { background: #607d8b; }
    </style>
  </head>
  <body>
    <div id="user-control-panel">
      <small style="color: #666; font-weight: bold;">USUARIOS CONECTADOS:</small>
      <ul id="user-ui-list">
          </ul>
    </div>

    <ul id="messages"></ul>

    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
      <button id="llamada" type="button">Llamar a todos</button>
      <button id="btn-enviar">Enviar</button>
      <button id="btn-hablar" type="button">Pulsar para Hablar</button>
      <button id="btn-mute" type="button">Mute Local</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script type="module" src="chat.js"></script>
    <script type="module" src="vcWebRTC.js"></script>
    <script type="module" src="reconocimiento.js"></script>
  </body>
</html>
